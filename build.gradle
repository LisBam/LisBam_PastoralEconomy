buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.5'
group = 'lisbam.pastoraleconomy'
archivesBaseName = 'LisBam_PastoralEconomy'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

// Source files and gameplay labels are UTF-8. Keep compilation deterministic on
// Windows hosts whose default code page is not UTF-8.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

jar {
    manifest {
        attributes([
            "Specification-Title": "LisBam_PastoralEconomy",
            "Specification-Vendor": "LisBam",
            "Specification-Version": project.version,
            "Implementation-Title": "LisBam_PastoralEconomy",
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"LisBam",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "FMLCorePlugin": "lisbam.pastoraleconomy.core.EnchantingTableCorePlugin",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

// ForgeGradle 3 reobfuscates the distributable jar after the normal jar task.
jar.finalizedBy('reobfJar')

// Keep the ready-to-install artifact in one stable location.  This task runs
// after reobfuscation, so release never receives the development-name jar.
task exportReleaseJar(type: Copy) {
    group = 'distribution'
    description = 'Copies the reobfuscated distributable jar into release/.'
    dependsOn 'reobfJar'
    from "$buildDir/libs"
    include "${archivesBaseName}-${version}.jar"
    into "$projectDir/release"
}

task verifyReleaseJar {
    group = 'verification'
    description = 'Checks that every compiled production class is readable from the exported Java 8 jar.'
    dependsOn 'exportReleaseJar'
    doLast {
        File releaseJar = file("$projectDir/release/${archivesBaseName}-${version}.jar")
        if (!releaseJar.isFile() || releaseJar.length() == 0L) {
            throw new GradleException("Missing or empty release jar: ${releaseJar}")
        }
        File classesDir = file("$buildDir/classes/java/main")
        java.util.jar.JarFile jarFile = new java.util.jar.JarFile(releaseJar)
        int checkedClasses = 0
        try {
            fileTree(classesDir).matching { include '**/*.class' }.each { File classFile ->
                String entryName = classesDir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
                java.util.jar.JarEntry entry = jarFile.getJarEntry(entryName)
                if (entry == null || entry.size == 0L) {
                    throw new GradleException("Release jar is missing compiled class: ${entryName}")
                }
                byte[] header = new byte[8]
                InputStream input = jarFile.getInputStream(entry)
                int offset = 0
                try {
                    while (offset < header.length) {
                        int read = input.read(header, offset, header.length - offset)
                        if (read < 0) {
                            break
                        }
                        offset += read
                    }
                } finally {
                    input.close()
                }
                int majorVersion = offset == header.length
                        ? ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        : -1
                if (majorVersion != 52) {
                    throw new GradleException("Release class is not Java 8 bytecode: ${entryName} (major ${majorVersion})")
                }
                checkedClasses++
            }
        } finally {
            jarFile.close()
        }
        if (checkedClasses == 0) {
            throw new GradleException('No production classes were checked in the release jar')
        }
        logger.lifecycle("Verified ${checkedClasses} Java 8 production classes in ${releaseJar.name}")
    }
}

build.finalizedBy('verifyReleaseJar')

task marketCoreSelfTest(type: JavaExec) {
    group = 'verification'
    description = 'Runs the standalone deterministic market-core self-test.'
    classpath = sourceSets.test.runtimeClasspath
    main = 'lisbam.pastoraleconomy.market.MarketCoreSelfTest'
}

